<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7df9ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Architectural Diamond Grid -->
  <polygon points="256,52 460,256 256,460 52,256" fill="rgba(10, 25, 47, 0.7)" stroke="#00f0ff" stroke-width="8" filter="url(#glow)" />
  <polygon points="256,92 420,256 256,420 92,256" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.6" />

  <!-- The Architectural Blueprint 'B' / 'M' Monogram Glyphs -->
  <path d="M128,340 L128,172 L256,290 L384,172 L384,340" fill="none" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="square" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Center Apex Command Node -->
  <circle cx="256" cy="140" r="16" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="140" r="8" fill="#00f0ff" />

  <!-- Tech Corner Markers -->
  <line x1="80" y1="80" x2="120" y2="80" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5" />
  <line x1="80" y1="80" x2="80" y2="120" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5" />
  <line x1="432" y1="80" x2="392" y2="80" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5" />
  <line x1="432" y1="80" x2="432" y2="120" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5" />
</svg>
