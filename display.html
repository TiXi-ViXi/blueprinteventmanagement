    const bySerial = {};
    EMBEDDED_ATTENDEES.forEach(a => { bySerial[a.serial.toUpperCase()] = a; });

    let lastLogId = null;
    let stateVersion = -1;

    function toggleFs() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }

    function updateClock() {
      document.getElementById('stage-time').textContent = new Date().toLocaleTimeString([], { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showAttendee(log) {
      if (!log) return;
      const p = bySerial[(log.serial || '').toUpperCase()];
      if (!p) return;

      const card = document.getElementById('stage-card');
      const banner = document.getElementById('stage-banner');
      const bText = document.getElementById('stage-banner-text');
      const img = document.getElementById('stage-photo');
      const ph = document.getElementById('stage-placeholder');

      if (log.action === 'EXIT') {
        banner.className = 'stage-banner exit';
        bText.textContent = 'THANK YOU! // EXIT RECORDED';
        card.style.borderColor = '#00e5ff';
        img.style.borderColor = '#00e5ff';
      } else {
        banner.className = 'stage-banner entry';
        bText.textContent = 'WELCOME! // ENTRY GRANTED';
        card.style.borderColor = '#00e676';
        img.style.borderColor = '#00e676';
      }

      const hdUrl = (navigator.onLine && p.photo) ? `/static/photos/${p.photo}?v=4` : null;
      const fallback = (typeof EMBEDDED_PHOTOS !== 'undefined' && EMBEDDED_PHOTOS[p.serial]) ? EMBEDDED_PHOTOS[p.serial] : null;
      const src = hdUrl || fallback;
      if (src) {
        img.onerror = () => {
          img.onerror = null;
          if (fallback && img.src !== fallback) img.src = fallback;
          else { img.style.display = 'none'; ph.style.display = 'grid'; }
        };
        img.src = src;
        img.style.display = 'block';
        ph.style.display = 'none';
      } else {
        img.style.display = 'none';
        ph.style.display = 'grid';
      }

      document.getElementById('stage-role').textContent = `${p.role} // SL #${String(p.sl).padStart(3, '0')}`;
      document.getElementById('stage-name').textContent = p.name;
      document.getElementById('stage-desig').textContent = p.designation || p.role;
      document.getElementById('stage-company').textContent = p.company || '';
      document.getElementById('stage-serial').textContent = `ID: ${p.serial}`;

      card.classList.remove('pop');
      void card.offsetWidth;
      card.classList.add('pop');
    }

    function processLogs(logs, statusMap) {
      if (statusMap) {
        let checked = 0;
        Object.values(statusMap).forEach(st => {
          if (st.last_entry || st.status === 'inside' || st.status === 'exited') checked++;
        });
        document.getElementById('led-count').textContent = checked;
      }
      if (logs && logs.length > 0) {
        const latest = logs[0];
        if (latest.id !== lastLogId) {
          lastLogId = latest.id;
          showAttendee(latest);
        }
      }
    }

    async function poll() {
      try {
        const res = await fetch(`/api/state?since_version=${stateVersion}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.unchanged) return;
        stateVersion = data.version || stateVersion;
        processLogs(data.logs || [], data.status_map || {});
      } catch (_) {
        // Local storage fallback if offline on same machine
        try {
          const l = JSON.parse(localStorage.getItem('bsaa_gate_logs_v1') || '[]');
          if (l.length) processLogs(l, null);
        } catch (_) {}
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'bsaa_gate_logs_v1') {
        try {
          const l = JSON.parse(e.newValue || '[]');
          if (l.length) processLogs(l, null);
        } catch (_) {}
      }
    });

    setInterval(poll, 750);
    poll();
  </script>
