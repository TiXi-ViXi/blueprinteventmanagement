server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dynamic & Clean URL Routing
    location = /login {
        try_files /login.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /dashboard {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /bsaaevent {
        try_files /bsaaevent.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API Endpoints -> Python Backend on Port 8088
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML Pages: No-cache for immediate updates
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static Assets: Fast CDN Cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
